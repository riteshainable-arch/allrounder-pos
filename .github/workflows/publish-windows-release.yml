name: Publish Windows release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - electron-builder.yml
      - .github/workflows/publish-windows-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $versionText = (node -p "require('./package.json').version").Trim()
          if ($versionText -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use stable major.minor.patch format; found $versionText."
          }

          $latestTag = gh release list --repo riteshainable-arch/allrounder-pos --limit 1 --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read releases from riteshainable-arch/allrounder-pos. Check the repo and RELEASE_REPO_TOKEN."
          }

          if (-not [string]::IsNullOrWhiteSpace($latestTag) -and $latestTag -ne "null") {
            $latestVersionText = $latestTag.Trim().TrimStart("v")
            if ([version]$versionText -le [version]$latestVersionText) {
              throw "Version $versionText must be greater than the latest release $latestTag. Bump package.json and package-lock.json."
            }
          }

      - name: Install dependencies
        run: npm ci

      - name: Build renderer and main process
        run: npm run build

      - name: Prepare Windows SQLite binary
        run: npm run rebuild:win

      - name: Create release before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $versionText = (node -p "require('./package.json').version").Trim()
          $tag = "v$versionText"
          gh release create $tag `
            --repo riteshainable-arch/allrounder-pos `
            --target $env:GITHUB_SHA `
            --title $versionText `
            --notes "AllRounder Payroll $versionText"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create release $tag."
          }

      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
